<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS OK</title>
</head>
<body>

<h1>GPS OK</h1>
<button onclick="gps()">Obtenir posició</button>
<p id="r">---</p>

<script>
function gps(){
  navigator.geolocation.getCurrentPosition(
    p => r.innerHTML = 
      "LAT: " + p.coords.latitude + "<br>" +
      "LON: " + p.coords.longitude,
    e => r.innerHTML = "Error GPS: " + e.message
  );
}
</script>

</body>
</html>
