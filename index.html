<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTM App</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b7cff">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Llibreria UTM (en local, per funcionar sense internet) -->
  <script src="./proj4.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 12px;
      margin: 0;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 4px 0 10px; }

    /* Quadre de resultat, a dalt per veure'l sense baixar */
    #resultat {
      min-height: 90px;
      margin: 0 0 10px;
      padding: 10px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* Botons en dues columnes, meitat de grans que abans */
    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 15px;
    }
    .ample { margin-bottom: 8px; }
    .perill { background: #ff4d4d; color: white; }
    #nomPunt {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 15px;
    }
    #historial { margin-top: 14px; text-align: left; font-size: 14px; }
  </style>
</head>

<body>

<h1>Coordenades UTM</h1>

<p id="resultat">---</p>

<div class="fila">
  <button onclick="obtenirPosicio()">Obtenir posició</button>
  <button onclick="fixarPosicio()">Fixar posició</button>
</div>

<!-- Botó per triar el mètode: millor lectura o mitjana -->
<button id="btnMetode" class="ample" onclick="canviarMetode()"></button>

<input id="nomPunt" placeholder="Nom del punt (opcional)">

<div class="fila">
  <button onclick="copiar()">Copiar UTM</button>
  <button onclick="guardarActual()">Guardar punt</button>
</div>

<div class="fila">
  <button onclick="exportarCSV()">Exportar CSV</button>
  <button class="perill" onclick="esborrarHistorial()">Esborrar historial</button>
</div>

<div id="historial"></div>

<script>
// ---------- AJUSTOS (els pots canviar aquí) ----------
// Només les lectures amb aquesta precisió (en metres) o millor entren a la mitjana.
const LLINDAR_MITJANA = 3;

// ---------- VARIABLES ----------
let ultimaUTM = "";
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let watchId = null;            // identificador del seguiment GPS
let millorPosicio = null;      // la lectura amb millor precisió
let tempsMillora = null;       // moment en què la millor lectura va millorar per darrer cop
let lecturesBones = [];        // lectures amb precisió <= LLINDAR_MITJANA (per a la mitjana)
let precisioActual = null;     // precisió de l'última lectura rebuda
let timerEstat = null;         // refresc cada segon del temps sense millorar
let metode = localStorage.getItem("metode") || "millor"; // "millor" o "mitjana"

// ---------- FUNCIONS AUXILIARES ----------

// Lletra de la banda de latitud (C...X)
function obtenirBanda(lat) {
  const bandes = "CDEFGHJKLMNPQRSTUVWX";
  const index = Math.floor((lat + 80) / 8);
  return bandes[index] || "";
}

// Evita que el nom escrit es interpreti com a codi HTML
function escapa(text) {
  return String(text).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Text del botó de mètode
function pintarMetode() {
  document.getElementById("btnMetode").textContent =
    metode === "millor"
      ? "Mètode: Millor lectura"
      : `Mètode: Mitjana (lectures ≤ ${LLINDAR_MITJANA} m)`;
}

function canviarMetode() {
  metode = metode === "millor" ? "mitjana" : "millor";
  localStorage.setItem("metode", metode);
  pintarMetode();
}

// ---------- MOSTRAR L'ESTAT MENTRE BUSCA ----------
function pintarEstat() {
  if (precisioActual === null) return; // encara no hi ha cap lectura
  const segons = Math.floor((Date.now() - tempsMillora) / 1000);

  let text =
    `Buscant millor senyal...<br>` +
    `Precisió actual: ± ${precisioActual.toFixed(1)} m<br>` +
    `Millor: ± ${millorPosicio.coords.accuracy.toFixed(1)} m<br>` +
    `La millor lectura fa ${segons} s que no millora`;

  if (metode === "mitjana") {
    text += `<br>Lectures ≤ ${LLINDAR_MITJANA} m: ${lecturesBones.length}`;
  }
  document.getElementById("resultat").innerHTML = text;
}

function aturarCerca() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  clearInterval(timerEstat);
}

// ---------- OBTENIR POSICIÓ ----------
function obtenirPosicio() {
  const r = document.getElementById("resultat");
  r.textContent = "Buscant millor senyal GPS...";

  aturarCerca();
  millorPosicio = null;
  lecturesBones = [];
  precisioActual = null;
  tempsMillora = null;

  watchId = navigator.geolocation.watchPosition(
    p => {
      precisioActual = p.coords.accuracy;

      // Si és la millor fins ara, la guardem i reiniciem el comptador de temps
      if (!millorPosicio || precisioActual < millorPosicio.coords.accuracy) {
        millorPosicio = p;
        tempsMillora = Date.now();
      }

      // Per a la mitjana: guardem totes les lectures prou bones
      if (precisioActual <= LLINDAR_MITJANA) {
        lecturesBones.push({ lat: p.coords.latitude, lon: p.coords.longitude });
      }

      pintarEstat();
    },
    e => {
      let missatge = "";
      switch (e.code) {
        case e.PERMISSION_DENIED:    missatge = "❌ Permís GPS denegat"; break;
        case e.POSITION_UNAVAILABLE: missatge = "❌ Posició no disponible"; break;
        case e.TIMEOUT:              missatge = "⏳ Temps d'espera esgotat"; break;
        default:                     missatge = "❌ Error desconegut";
      }
      r.textContent = missatge;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );

  // Refresca el text cada segon perquè el temps vagi pujant
  timerEstat = setInterval(pintarEstat, 1000);
}

// ---------- FIXAR POSICIÓ ----------
function fixarPosicio() {
  if (!millorPosicio) {
    alert("Encara no hi ha cap posició");
    return;
  }

  let lat, lon, detall;

  if (metode === "mitjana") {
    if (lecturesBones.length === 0) {
      alert(`Encara no hi ha cap lectura de ± ${LLINDAR_MITJANA} m o millor`);
      return;
    }
    // Mitjana simple de latitud i longitud de les lectures bones
    const n = lecturesBones.length;
    lat = lecturesBones.reduce((s, l) => s + l.lat, 0) / n;
    lon = lecturesBones.reduce((s, l) => s + l.lon, 0) / n;
    detall = `mitjana de ${n} lectures`;
  } else {
    lat = millorPosicio.coords.latitude;
    lon = millorPosicio.coords.longitude;
    detall = `millor lectura, ± ${millorPosicio.coords.accuracy.toFixed(1)} m`;
  }

  aturarCerca();

  const zona = Math.floor((lon + 180) / 6) + 1;
  const banda = obtenirBanda(lat);

  const projUTM = `+proj=utm +zone=${zona} +datum=WGS84 +units=m +no_defs`;
  const utm = proj4("EPSG:4326", projUTM, [lon, lat]);

  ultimaUTM = `${zona}${banda} ${utm[0].toFixed(3)} ${utm[1].toFixed(3)}`;

  document.getElementById("resultat").innerHTML =
    `<strong>UTM (fixat)</strong><br>${ultimaUTM}<br>${detall}`;
}

// ---------- COPIAR ----------
function copiar() {
  if (!ultimaUTM) {
    alert("Primer obtén la posició");
    return;
  }
  navigator.clipboard.writeText(ultimaUTM).then(
    () => alert("UTM copiat!"),
    () => alert("Error en copiar")
  );
}

// ---------- HISTORIAL ----------
function mostrarHistorial() {
  const r = document.getElementById("historial");

  if (historial.length === 0) {
    r.innerHTML = "Sense punts guardats.";
    return;
  }

  r.innerHTML = "<strong>Historial:</strong><br>" +
    historial.map((p, i) =>
      `• ${i + 1}. ${escapa(p.nom)} → ${escapa(p.utm)}
       <button style="width:auto; padding:2px 8px;" onclick="eliminarPunt(${i})">❌</button><br>
       &nbsp;&nbsp;${escapa(p.data)} ${escapa(p.hora)}`
    ).join("<br>");
}

function guardarActual() {
  if (!ultimaUTM) {
    alert("Primer obtén la posició");
    return;
  }

  const input = document.getElementById("nomPunt");
  const ara = new Date();

  historial.push({
    nom: input.value.trim() || "Sense nom",
    utm: ultimaUTM,
    data: ara.toLocaleDateString(),
    hora: ara.toLocaleTimeString()
  });

  localStorage.setItem("historial", JSON.stringify(historial));
  mostrarHistorial();
  input.value = ""; // netejar el camp després de guardar
}

function eliminarPunt(index) {
  if (!confirm("Vols eliminar aquest punt?")) return;
  historial.splice(index, 1);
  localStorage.setItem("historial", JSON.stringify(historial));
  mostrarHistorial();
}

function esborrarHistorial() {
  if (!confirm("Segur que vols esborrar tot l'historial?")) return;
  historial = [];
  localStorage.removeItem("historial");
  mostrarHistorial();
}

// ---------- EXPORTAR CSV ----------
// Columnes: Punt; Nom; Zona; X; Y; Data; Hora  (separades per ";" perquè
// Excel en català/castellà les obri bé en columnes)
function exportarCSV() {
  if (historial.length === 0) {
    alert("No hi ha dades");
    return;
  }

  let csv = "Punt;Nom;Zona;X;Y;Data;Hora\n";

  historial.forEach((p, i) => {
    // p.utm té el format "31T 123456.789 4567890.123"
    const [zona, x, y] = p.utm.split(" ");
    const nom = p.nom.replace(/"/g, '""'); // protegeix les cometes
    csv += `${i + 1};"${nom}";${zona};${x};${y};${p.data};${p.hora}\n`;
  });

  // "\uFEFF" fa que Excel llegeixi bé els accents
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "historial_utm.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ---------- ARRANCADA ----------
pintarMetode();
mostrarHistorial();

// Registra el service worker (perquè funcioni sense internet)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW OK"))
    .catch(err => console.log("SW error", err));
}
</script>

</body>
</html>
