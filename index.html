<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTM App</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b7cff">

  <!-- Icona per iOS -->
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Llibreria UTM -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-size: 18px;
    }
    #resultat {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>Coordenades UTM</h1>

<button onclick="obtenirPosicio()">Obtenir posició</button>
<button onclick="copiar()">Copiar UTM</button>

<p id="resultat">---</p>

<script>
let ultimaUTM = "";
function obtenirBanda(lat) {
  const bandes = "CDEFGHJKLMNPQRSTUVWX";
  const index = Math.floor((lat + 80) / 8);
  return bandes[index] || "";
}
function obtenirPosicio() {
  const r = document.getElementById("resultat");
  r.textContent = "Obtenint posició...";

  navigator.geolocation.getCurrentPosition(
    p => {
      const lat = p.coords.latitude;
      const lon = p.coords.longitude;

      if (typeof proj4 === "undefined") {
        r.textContent = "Carregant llibreria...";
        setTimeout(obtenirPosicio, 500);
        return;
      }

      const zona = Math.floor((lon + 180) / 6) + 1;
      const banda = obtenirBanda(lat);
      const projUTM = `+proj=utm +zone=${zona} +datum=WGS84 +units=m +no_defs`;

      const utm = proj4("EPSG:4326", projUTM, [lon, lat]);

      const x = utm[0].toFixed(3);
const y = utm[1].toFixed(3);

ultimaUTM = `${zona}${banda} ${x} ${y}`;

document.getElementById("resultat").innerHTML =
  `Lat: ${lat}<br>` +
  `Lon: ${lon}<br><br>` +
  `<strong>UTM</strong><br>` +
  `${zona}${banda} ${x} ${y}`;

      r.innerHTML =
        `Lat: ${lat}<br>` +
        `Lon: ${lon}<br><br>` +
        `<strong>UTM</strong><br>` +
        `X: ${utm[0].toFixed(2)} m<br>` +
        `Y: ${utm[1].toFixed(2)} m<br>` +
        `Zona: ${zona}`;
    },
    e => r.textContent = "Error GPS: " + e.message
  );
}

function copiar() {
  if (!ultimaUTM) {
    alert("Primer obtén la posició");
    return;
  }

  navigator.clipboard.writeText(ultimaUTM).then(
    () => alert("UTM copiat!"),
    () => alert("Error en copiar")
  );
}
</script>

</body>
</html>
