<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTM App</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b7cff">

  <!-- Icona per iOS -->
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Llibreria UTM -->
  <script src="./proj4.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-size: 18px;
    }
    #resultat {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>Coordenades UTM</h1>

<button onclick="obtenirPosicio()">Obtenir posició</button>
<button onclick="fixarPosicio()">Fixar posició</button>
<button onclick="copiar()">Copiar UTM</button>
<input id="nomPunt" placeholder="Nom del punt (opcional)" style="width:100%; padding:10px; margin-top:10px;">
<button onclick="guardarActual()">Guardar punt</button>
<button onclick="exportarCSV()">Exportar CSV</button>
<button onclick="esborrarHistorial()" style="background:#ff4d4d; color:white;">
  Esborrar historial
</button>

<p id="resultat">---</p>
<div id="historial" style="margin-top:20px;"></div>

<script>
let ultimaUTM = "";
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let watchId = null;
let millorPosicio = null;
let tempsInici = null;
function obtenirBanda(lat) {
  const bandes = "CDEFGHJKLMNPQRSTUVWX";
  const index = Math.floor((lat + 80) / 8);
  return bandes[index] || "";
}
function obtenirPosicio() {
  const r = document.getElementById("resultat");
  r.textContent = "Buscant millor senyal GPS...";

  millorPosicio = null;
  tempsInici = Date.now();

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(
    p => {
      const precisio = p.coords.accuracy;

      // Guardem la millor
      if (!millorPosicio || precisio < millorPosicio.coords.accuracy) {
        millorPosicio = p;
      }

      // Mostrem estat
      r.innerHTML =
        `Buscant millor senyal...<br>` +
        `Precisió actual: ± ${precisio.toFixed(1)} m<br>` +
        `Millor: ± ${millorPosicio.coords.accuracy.toFixed(1)} m`;

      // OPCIONAL: auto aturar si ja és bona
      

    },
    e => {
      let missatge = "";

      switch (e.code) {
        case e.PERMISSION_DENIED:
          missatge = "❌ Permís GPS denegat";
          break;
        case e.POSITION_UNAVAILABLE:
          missatge = "❌ Posició no disponible";
          break;
        case e.TIMEOUT:
          missatge = "⏳ Temps d'espera esgotat";
          break;
        default:
          missatge = "❌ Error desconegut";
      }

      r.textContent = missatge;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );

}
function copiar() {
  if (!ultimaUTM) {
    alert("Primer obtén la posició");
    return;
  }

  navigator.clipboard.writeText(ultimaUTM).then(
    () => alert("UTM copiat!"),
    () => alert("Error en copiar")
  );
}
function fixarPosicio() {
  if (!millorPosicio) {
    alert("Encara no hi ha cap posició");
    return;
  }

  navigator.geolocation.clearWatch(watchId);

  const lat = millorPosicio.coords.latitude;
  const lon = millorPosicio.coords.longitude;

  const zona = Math.floor((lon + 180) / 6) + 1;
  const banda = obtenirBanda(lat);

  const projUTM = `+proj=utm +zone=${zona} +datum=WGS84 +units=m +no_defs`;
  const utm = proj4("EPSG:4326", projUTM, [lon, lat]);

  const x = utm[0].toFixed(3);
  const y = utm[1].toFixed(3);

  ultimaUTM = `${zona}${banda} ${x} ${y}`;

  document.getElementById("resultat").innerHTML =
    `<strong>UTM (fixat)</strong><br>` +
    ultimaUTM +
    `<br>± ${millorPosicio.coords.accuracy.toFixed(1)} m`;
}
function guardarPunt(text) {
  historial.push(text);
  localStorage.setItem("historial", JSON.stringify(historial));
  mostrarHistorial();
}
function mostrarHistorial() {
  const r = document.getElementById("historial");

  if (historial.length === 0) {
    r.innerHTML = "Sense punts guardats.";
    return;
  }

  r.innerHTML = "<strong>Historial:</strong><br>" +
    historial.map((p, i) =>
  `• ${i + 1}. ${p.nom} → ${p.utm}
   <button onclick="eliminarPunt(${i})">❌</button><br>
   &nbsp;&nbsp;${p.data} ${p.hora}`
).join("<br>");
}
function eliminarPunt(index) {
  const confirmar = confirm("Vols eliminar aquest punt?");

  if (!confirmar) return;

  historial.splice(index, 1);

  localStorage.setItem("historial", JSON.stringify(historial));

  mostrarHistorial();
}
function guardarActual() {
  if (!ultimaUTM) {
    alert("Primer obtén la posició");
    return;
  }

  const input = document.getElementById("nomPunt");
  const nom = input.value.trim();

  const ara = new Date();

  const punt = {
    nom: nom || "Sense nom",
    utm: ultimaUTM,
    data: ara.toLocaleDateString(),
    hora: ara.toLocaleTimeString()
  };

  guardarPunt(punt);

  input.value = ""; // netejar camp després de guardar
}
mostrarHistorial();
function exportarCSV() {
  if (historial.length === 0) {
    alert("No hi ha dades");
    return;
  }

  let csv = "data:text/csv;charset=utf-8,";
  csv += "Punt,Coordenades UTM\n";

  historial.forEach((p, i) => {
    csv += `${i + 1},"${p}"\n`;
  });

  const encodedUri = encodeURI(csv);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "historial_utm.csv");
  document.body.appendChild(link);
  link.click();
}
function esborrarHistorial() {
  const confirmar = confirm("Segur que vols esborrar tot l'historial?");

  if (!confirmar) return;

  historial = [];
  localStorage.removeItem("historial");

  mostrarHistorial();
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW OK"))
    .catch(err => console.log("SW error", err));
}
</script>

</body>
</html>
